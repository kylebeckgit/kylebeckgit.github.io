# GitHub Pages publishes this branch with Jekyll (there is no .nojekyll file).
# The built site at the root is served. Source, screenshots, and art stay in git
# and are left out of the published site.
# The unlisted describe preview and the unlisted Lovesac article stay out of the sitemap.
defaults:
  - scope:
      path: "z3-describe-preview.html"
    values:
      sitemap: false
  - scope:
      path: "making-lovesac-stealthtech-smart/index.html"
    values:
      sitemap: false

exclude:
  - art
  - screens
  - src
  - scripts
  - workers
  - public
  - node_modules
  - docs
  - vendor
  - dist
  - _site
  - .astro
  - .jekyll-cache
  - .github
  - package.json
  - package-lock.json
  - astro.config.mjs
  - docs-lemonsqueezy-migration.md
  - Gemfile
  - Gemfile.lock
