<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduled Maintenance | Kyle Beck</title>
  <meta name="description" content="Kyle Beck - Musician & Developer. The website is currently undergoing scheduled maintenance. Services will resume shortly.">
  <link rel="icon" href="/assets/images/favicon.png" type="image/png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #080b11;
      --card-bg: rgba(13, 18, 30, 0.45);
      --border-color: rgba(255, 255, 255, 0.07);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.2);
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background gradient blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 1;
      opacity: 0.35;
      pointer-events: none;
    }

    .blob-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, var(--emerald) 0%, transparent 70%);
      top: -10%;
      left: 15%;
      animation: float-slow 22s infinite alternate ease-in-out;
    }

    .blob-2 {
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, var(--accent-blue) 0%, transparent 70%);
      bottom: -15%;
      right: 10%;
      animation: float-slow 28s infinite alternate-reverse ease-in-out;
    }

    .blob-3 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, var(--accent-purple) 0%, transparent 70%);
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: float-slow 18s infinite alternate ease-in-out;
    }

    @keyframes float-slow {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(60px, -40px) scale(1.1);
      }
      100% {
        transform: translate(-40px, 50px) scale(0.9);
      }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 580px;
      padding: 20px;
    }

    /* Glassmorphism Card styling */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 56px 48px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Subtle shine animation on hover */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 200%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.04),
        transparent
      );
      transform: rotate(30deg);
      transition: 1s;
      pointer-events: none;
    }

    .card:hover::before {
      left: 150%;
    }

    /* Header & Branding */
    .header {
      margin-bottom: 24px;
    }

    .logo-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px auto;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: var(--emerald);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: 2.6rem;
      font-weight: 800;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #ffffff 40%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.03em;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Pulsing status indicator */
    .status-container {
      margin-bottom: 32px;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(16, 185, 129, 0.06);
      border: 1px solid rgba(16, 185, 129, 0.15);
      padding: 8px 18px;
      border-radius: 100px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.05);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--emerald);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 10px var(--emerald);
    }

    .status-dot::after {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 50%;
      border: 2px solid var(--emerald);
      opacity: 0;
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.6);
        opacity: 0.9;
      }
      100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    .status-text {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--emerald);
      letter-spacing: 0.03em;
    }

    /* Message Section */
    .message-section {
      margin-bottom: 40px;
    }

    .message-section h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .message-section p {
      color: var(--text-secondary);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    /* Footer & Quick Links */
    .footer {
      border-top: 1px solid var(--border-color);
      padding-top: 36px;
    }

    .footer-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-secondary);
      letter-spacing: 0.12em;
      margin-bottom: 18px;
      font-weight: 600;
      opacity: 0.8;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .icon {
      width: 18px;
      height: 18px;
    }

    .btn-primary {
      background: rgba(255, 255, 255, 0.04);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-primary:hover {
      background: #ffffff;
      color: var(--bg-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-secondary:hover {
      background: #ffffff;
      color: var(--bg-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
    }

    .btn-coffee {
      background: rgba(255, 221, 0, 0.07);
      color: #ffdd00;
      border: 1px solid rgba(255, 221, 0, 0.15);
    }

    .btn-coffee:hover {
      background: #ffdd00;
      color: #000000;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 221, 0, 0.15);
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .card {
        padding: 40px 24px;
        border-radius: 24px;
      }
      .title {
        font-size: 2.2rem;
      }
      .message-section h2 {
        font-size: 1.4rem;
      }
      .social-links {
        flex-direction: column;
        gap: 12px;
      }
      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient background elements -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <main class="container" id="maintenance-container">
    <div class="card" id="maintenance-card">
      <header class="header">
        <div class="logo-container">KB</div>
        <h1 class="title">Kyle Beck</h1>
        <p class="subtitle">Musician & Developer</p>
      </header>

      <div class="status-container">
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">Under Scheduled Maintenance</span>
        </div>
      </div>

      <section class="message-section">
        <h2>We'll Be Back Shortly</h2>
        <p>I'm performing some system updates and tuning up the site codebase. Check back soon for new features and projects!</p>
      </section>

      <footer class="footer">
        <p class="footer-title">Get in Touch</p>
        <div class="social-links">
          <a href="mailto:kyle@kyle-beck.com" id="email-link" class="btn btn-primary">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
            Email Me
          </a>
          <a href="https://github.com/kylebeckgit" id="github-link" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">
            <svg class="icon" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

            GitHub
          </a>
          <a href="https://buymeacoffee.com/kylebeck" id="coffee-link" class="btn btn-coffee" target="_blank" rel="noopener noreferrer">
            ☕ Buy Me a Coffee
          </a>
        </div>
      </footer>
    </div>
  </main>
</body>
</html>
