<!doctype html><body><pre id="out">pending</pre><iframe id="f" src="/z3-describe-preview/" style="width:1000px;height:800px"></iframe>
<script>
const out=[];const log=(m)=>out.push(m);
const f=document.getElementById('f');
f.addEventListener('load',async()=>{
 const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
 try{
 const d=f.contentDocument, w=f.contentWindow;
 w.addEventListener('error',e=>log('pageerror '+e.message));
 await wait(500);
 d.querySelector('#tab-designer').click(); await wait(500);
 const q=d.querySelector('[data-object-q]'); const sel=d.querySelector('[data-roll-object]');
 const type=async(t)=>{q.value=t; q.dispatchEvent(new w.Event('input',{bubbles:true})); await wait(50);};
 log('object options '+sel.options.length);
 await type('rusty hub'); log('suggestions for "rusty hub": '+JSON.stringify([...d.querySelectorAll('[data-object-list] button')].map(b=>b.textContent)));
 await type('slin'); log('suggestions for "slin": '+JSON.stringify([...d.querySelectorAll('[data-object-list] button')].map(b=>b.textContent)));
 d.querySelector('[data-object-list] button').click(); await wait(50);
 log('selected '+sel.value+' materialDisabled '+d.querySelector('[data-roll-material]').disabled+' loadVisible '+!d.querySelector('[data-object-load]').hidden);
 log('note: '+d.querySelector('[data-object-note]').textContent.slice(0,110));
 const rows=()=>d.querySelectorAll('tbody tr').length;
 d.querySelector('[data-object-load]').click(); await wait(300);
 log('after load: read="'+d.querySelector('[data-roll-read]').textContent+'" density='+d.querySelector('[data-density]').value+' rows='+rows());
 d.querySelector('[data-roll]').click(); await wait(300);
 log('after roll: read="'+d.querySelector('[data-roll-read]').textContent+'" density='+d.querySelector('[data-density]').value+' rows='+rows());
 const wild=d.querySelector('[data-roll-wildness]'); if(wild){ wild.value='1.35'; wild.dispatchEvent(new w.Event('input',{bubbles:true})); }
 d.querySelector('[data-roll]').click(); await wait(300);
 log('high wild roll: read="'+d.querySelector('[data-roll-read]').textContent+'" rows='+rows());
 await type('hang drum'); q.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true})); await wait(50);
 log('enter on "hang drum" picked '+sel.value);
 d.querySelector('[data-roll-back]').click(); await wait(200); log('back works, read="'+d.querySelector('[data-roll-read]').textContent+'"');
 sel.value=''; sel.dispatchEvent(new w.Event('change',{bubbles:true}));
 d.querySelector('[data-roll]').click(); await wait(300);
 log('material roll after clearing object: read="'+d.querySelector('[data-roll-read]').textContent+'" materialDisabled '+d.querySelector('[data-roll-material]').disabled);
 }catch(e){log('ERR '+e.message)}
 document.getElementById('out').textContent=out.join('\n');
});
</script>
